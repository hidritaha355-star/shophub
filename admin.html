<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ShopHub | إدارة المنتجات</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#152033;font:15px Arial,sans-serif}.wrap{max-width:1050px;margin:35px auto;padding:0 16px}.panel{background:#fff;border:1px solid #e5e8f0;border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 10px 30px #14213a0a}h1{margin:0 0 8px}p{color:#64748b}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin:10px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid #d9deea;border-radius:10px;font:inherit}textarea{min-height:90px}button,.link{border:0;border-radius:10px;padding:11px 16px;background:#7357f5;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#eef0f7;color:#26334a}.danger{background:#b42318}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.product{border:1px solid #e6e9f0;border-radius:12px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}.muted{color:#64748b;font-size:13px}.error{color:#b42318}.ok{color:#16794a}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:17px}.product{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap">
<header class="row" style="justify-content:space-between"><div><h1>ShopHub — إدارة المنتجات</h1><p>أضف منتجاتك الرقمية وعدّلها وأخفِ المنتجات التي لم تعد تريد عرضها.</p></div><a class="link secondary" href="/">عرض المتجر</a></header>
<section id="login" class="panel"><h2>تسجيل دخول المدير</h2><label for="password">كلمة مرور الإدارة</label><input id="password" type="password" autocomplete="current-password"><p id="loginMsg" class="error"></p><button id="loginBtn">دخول</button></section>
<section id="dashboard" class="hidden">
<div class="panel"><div class="row" style="justify-content:space-between"><h2 id="formTitle">إضافة منتج رقمي</h2><button id="logout" class="secondary">تسجيل الخروج</button></div>
<form id="productForm"><input id="productId" type="hidden"><div class="grid">
<div><label>اسم المنتج *</label><input id="name" maxlength="120" required></div><div><label>السعر *</label><input id="price" type="number" min="0" step="0.01" required></div>
<div><label>الفئة</label><select id="category"><option>Ebooks</option><option>Planners</option><option>Templates</option><option>Courses</option><option>Other</option></select></div><div><label>العملة</label><select id="currency"><option>USD</option><option>EUR</option><option>TND</option><option>GBP</option></select></div>
<div><label>رمز/رابط الصورة</label><input id="image" placeholder="📘 أو https://..."></div><div><label>رابط الدفع Whop *</label><input id="checkout" type="url" placeholder="https://whop.com/checkout/..." required></div></div>
<label>وصف المنتج</label><textarea id="description" maxlength="2000"></textarea><div class="row" style="margin-top:14px"><button type="submit" id="saveBtn">حفظ المنتج</button><button type="button" id="cancelEdit" class="secondary hidden">إلغاء التعديل</button><span id="formMsg" class="muted"></span></div></form></div>
<div class="panel"><div class="row" style="justify-content:space-between"><h2>المنتجات</h2><button id="refresh" class="secondary">تحديث القائمة</button></div><div id="products"></div></div>
</section></main>
<script>
const $=id=>document.getElementById(id);let products=[];
async function api(path,opts={}){const r=await fetch('/api/admin/'+path,{...opts,credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok){const stage=d.debug_stage?' [مرحلة التشخيص: '+d.debug_stage+']':'';const detail=d.debug_error?' [التفاصيل: '+d.debug_error+']':'';throw Error((d.error||'حدث خطأ')+stage+detail+' (HTTP '+r.status+')')}return d}
function showDash(){ $('login').classList.add('hidden');$('dashboard').classList.remove('hidden');loadProducts()}
function logout(){return api('logout',{method:'POST'}).finally(()=>{ $('dashboard').classList.add('hidden');$('login').classList.remove('hidden')})}
$('loginBtn').onclick=async()=>{ $('loginMsg').textContent='';try{await api('login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';showDash()}catch(e){$('loginMsg').textContent=e.message}};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
$('logout').onclick=logout;$('refresh').onclick=loadProducts;
function resetForm(){$('productForm').reset();$('productId').value='';$('formTitle').textContent='إضافة منتج رقمي';$('saveBtn').textContent='حفظ المنتج';$('cancelEdit').classList.add('hidden')}
$('cancelEdit').onclick=resetForm;
$('productForm').onsubmit=async e=>{e.preventDefault();const id=$('productId').value;const p={name:$('name').value,price:Number($('price').value),category:$('category').value,currency:$('currency').value,image_url:$('image').value,checkout_url:$('checkout').value,description:$('description').value};try{await api(id?'products/'+id:'products',{method:id?'PUT':'POST',body:JSON.stringify(p)});$('formMsg').textContent='تم حفظ المنتج بنجاح';$('formMsg').className='ok';resetForm();await loadProducts()}catch(err){$('formMsg').textContent=err.message;$('formMsg').className='error'}};
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;$('productId').value=p.id;$('name').value=p.name;$('price').value=p.price;$('category').value=p.category;$('currency').value=p.currency;$('image').value=p.image_url;$('checkout').value=p.checkout_url;$('description').value=p.description;$('formTitle').textContent='تعديل المنتج';$('saveBtn').textContent='حفظ التعديلات';$('cancelEdit').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
async function deleteProduct(id){if(!confirm('إخفاء هذا المنتج من المتجر؟'))return;try{await api('products/'+id,{method:'DELETE'});await loadProducts()}catch(e){alert(e.message)}}
async function loadProducts(){try{const d=await api('products');products=d.products||[];$('products').innerHTML=products.length?products.map(p=>'<article class="product"><div><strong>'+esc(p.name)+'</strong><div class="muted">'+esc(p.category)+' · '+esc(p.currency)+' '+Number(p.price).toFixed(2)+' · '+(p.active?'ظاهر':'مخفي')+'</div></div><div class="row"><button class="secondary" onclick="editProduct('+p.id+')">تعديل</button><button class="danger" onclick="deleteProduct('+p.id+')">إخفاء</button></div></article>').join(''):'<p>لا توجد منتجات بعد.</p>'}catch(e){$('products').textContent=e.message;if(e.message==='Unauthorized.'){$('dashboard').classList.add('hidden');$('login').classList.remove('hidden')}}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
(async()=>{try{await api('products');showDash()}catch{}})();
</script></body></html>
